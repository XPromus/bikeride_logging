<main class="p-5 bg-background-primary w-screen h-screen flex flex-row space-x-5 text-text-primary">
  <div class="flex flex-col space-y-5 grow">
    <span class="text-success font-bold text-3xl">Ride Overview</span>
    <ride-upload (rideUploaded)="rideList.loadRides()"></ride-upload>
    <ride-list (rideSelected)="selectedRide.set($event)"></ride-list>
  </div>
  @if (selectedRide() !== null) {
    <div class="basis-2/3 h-full">
      <ride-display (rideDeleted)="selectedRide.set(null); rideList.loadRides()" [ride]="selectedRide()!" />
    </div> 
  }
</main>
