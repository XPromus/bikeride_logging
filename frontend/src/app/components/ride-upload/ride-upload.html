<div class="flex flex-col space-y-5">
    <label class="border-2 border-dashed rounded-lg p-6 text-center cursor-pointer bg-background-secondary hover:bg-background-tertiary transition-all duration-200">
        @if (selectedFile() !== null) {
            <span>{{ selectedFile()!.name }}</span>
        } @else {
            <span>Select GPX file</span>
        }
        <input type="file" accept=".gpx" (change)="onFileSelected($event)" class="hidden" />
    </label>

    @if (uploading()) {
        <span>Uploading...</span>
    } @else if (error()) {
        <span class="text-red-500">{{ error() }}</span>
    }
    
    <button (click)="onFileUpload()" class="p-2 bg-accent hover:bg-accent/50 hover:cursor-pointer rounded-lg transition-all duration-200">
        <span>Upload</span>
    </button>
</div>
