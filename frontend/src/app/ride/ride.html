<div class="flex flex-col spacey-y-5">
    @if (loading()) {
        <span>loading...</span>
    } @else if (error()) {
        <span class="text-red-500">{{ error() }}</span>
    } @else {
        @for (ride of rides(); track ride._id) {
            <div class="border rounded p-4">
                <h2 class="font-bold">{{ ride.name }}</h2>
                <p>{{ formatDate(ride.date) }} - {{ ride.distance / 1000 }}km - {{ ride.avgSpeed }}km/h</p>
            </div>
        }
    }
</div>
